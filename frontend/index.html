<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Biblioteca</title>
    <link rel="stylesheet" href="/frontend/style.css">
</head>
<body>
    <h1>Sistema de Biblioteca</h1>

    <section>
        <h2>Registrar Libro</h2>
        <form id="form-libro">
            <input type="text" name="titulo" placeholder="Título del libro" required>
            <input type="text" name="autor" placeholder="Autor del libro" required>
            <input type="number" name="codigo" placeholder="Código del libro" required>
            <button type="submit">Registrar Libro</button>
        </form>
    </section>

    <section>
        <h2>Registrar Usuario</h2>
        <form id="form-usuario">
            <input type="text" name="nombre" placeholder="Nombre del usuario" required>
            <input type="number" name="id_usuario" placeholder="ID del usuario" required>
            <button type="submit">Registrar Usuario</button>
        </form>
    </section>

    <section>
        <h2>Prestar Libro</h2>
        <form id="form-prestamo">
            <input type="number" name="codigo_libro" placeholder="Código del libro" required>
            <input type="number" name="id_usuario" placeholder="ID del usuario" required>
            <button type="submit">Prestar Libro</button>
        </form>
    </section>

    <section>
        <h2>Devolver Libro</h2>
        <form id="form-devolucion">
            <input type="number" name="codigo_libro" placeholder="Código del libro" required>
            <button type="submit">Devolver Libro</button>
        </form>
    </section>

    <section>
        <h2>Ver Libros</h2>
        <button onclick="cargarLibros()">Mostrar Libros</button>
    </section>

    <section>
        <h2>Ver Usuarios</h2>
        <button onclick="cargarUsuarios()">Mostrar Usuarios</button>
    </section>

    <section>
        <h2>Ver Prestamos</h2>
        <button onclick="cargarPrestamos()">Mostrar Préstamos</button>
    </section>

    <section>
        <h2>Resultado</h2>
        <pre id="resultado"></pre>
    </section>

    <script src="/frontend/app.js"></script>
</body>
</html>
